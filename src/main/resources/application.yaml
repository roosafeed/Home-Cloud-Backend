spring:
  application:
    name: Home Cloud

  jackson:
    time-zone: UTC

  jpa:
    open-in-view: true  # this is a low traffic app - safe to be true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    show_sql: true

management:
  endpoints:
    web:
      base-path: /health
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE